<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - Martyx Industries</title>
    <style>
      body { 
        margin: 0; 
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; 
        background: #0b0f14; 
        color: #e6edf3; 
        display: grid; 
        place-items: center; 
        min-height: 100vh; 
      }
      .card { 
        max-width: 520px; 
        padding: 24px; 
        border-radius: 16px; 
        background: #0f1622; 
        box-shadow: 0 6px 24px rgba(0,0,0,0.25); 
        text-align: center; 
      }
      h1 { 
        font-size: 1.25rem; 
        margin: 0 0 8px; 
      }
      p { 
        margin: 0 0 16px; 
        color: #9db1c9; 
        line-height: 1.5;
      }
      .cta { 
        display: inline-block; 
        padding: 10px 14px; 
        border-radius: 10px; 
        background: #1e2a3a; 
        color: #cfe1ff; 
        text-decoration: none; 
        transition: background-color 0.2s ease;
      }
      .cta:hover {
        background: #2a3441;
      }
      .offline-icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 16px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
        <path d="m15 5 4 4"/>
        <path d="M10 5.5 8 8l-2-2"/>
      </svg>
      <h1>You are offline</h1>
      <p>The page you requested isn't available offline yet. Check your connection and try again.</p>
      <a class="cta" href="/">Go to Home</a>
    </div>
  </body>
</html>
